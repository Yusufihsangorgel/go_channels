name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

  # Weekly, so SDK, dependency and runner-image drift shows up on its
  # own rather than waiting for the next push.
  schedule:
    - cron: '18 3 * * 1'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - name: Install dependencies
        run: dart pub get
      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .
      - name: Analyze
        run: dart analyze --fatal-infos
      - name: Test
        run: dart test

      # The READMEs quote these programs' output, so run them: analysis alone
      # would let an example keep compiling while printing something the docs
      # no longer match.
      - name: Run examples
        run: |
          dart run example/go_channels_example.dart
          dart run example/select_multiway.dart

      # Channels, scopes and cancellation are built on timers and the microtask
      # queue, which are scheduled differently off the VM. The library has no
      # platform-conditional code, so a difference here means a real behaviour
      # difference rather than a second implementation drifting.
      - name: Test on Chrome (dart2js)
        run: dart test -p chrome

      - name: Test on Chrome (dart2wasm)
        run: dart test -p chrome -c dart2wasm

